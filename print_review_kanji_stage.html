<!doctype html><html lang="ja"><meta charset="utf-8"><title>国語ステージプリント・見本</title><link rel="icon" href="data:,"><style>body{margin:0;color:#111;background:#e7e7e7}.controls{background:white;padding:14px;font:15px/1.8 sans-serif}select,button{padding:8px;margin:0 6px;font:inherit}#preview{width:max-content;min-width:100%}@media print{.controls{display:none}#preview{width:auto;min-width:0}}</style>
<nav class="controls"><b>国語ステージプリント・確認用</b>（保存・報酬付与なし）<br><select id="grade" aria-label="学年"></select><select id="variant" aria-label="出題形式"><option value="mix">読み10問・書き10問</option><option value="yomi">読み20問</option><option value="kaki">書き20問</option></select><select id="mode"><option value="student">児童用</option><option value="teacher">先生用解答</option></select><button id="print">印刷</button><span id="status"></span></nav><main id="preview"></main><script src="/kanji_data.js"></script><script type="module">
import {renderKanjiStagePrint} from './stage_print_layout.js';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);for(let g=1;g<=6;g++)$('grade').add(new Option(g+'年',g));$('grade').value=params.get('grade')||3;$('mode').value=params.get('mode')||'student';$('variant').value=params.get('variant')||'mix';
async function render(){window.reviewReady=false;const grade=Number($('grade').value),problems=window.KANJI_POOLS['kanji_g'+grade].slice(0,20);$('preview').innerHTML=renderKanjiStagePrint(problems,$('variant').value,'冒険ステージ・漢字テスト','','TEST-KANJI-'+grade,{grade,mode:$('mode').value});await document.fonts.ready;$('status').textContent='A4横向き・縦書き／20問・1ページ';window.reviewReady=true;}
for(const id of ['grade','variant','mode'])$(id).onchange=render;$('print').onclick=()=>window.print();render();
</script></html>
