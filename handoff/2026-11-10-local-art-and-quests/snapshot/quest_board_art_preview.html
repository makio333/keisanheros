<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>村人の依頼掲示板</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/reading_subquests.css"><link rel="stylesheet" href="/quest_board_notice.css">
<style>body{margin:0;background:#241e1a;overflow:hidden}#screen-quest-board{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0005}.quest-board-wood{width:min(1180px,97vw)}.preview-note{font-size:11px;color:#ecd8aa;margin:3px 0}.quest-board-header label{display:flex;align-items:center;gap:5px;color:#fff1cd;font-size:12px}.quest-board-header select{padding:4px}.medal-sample{display:flex;align-items:center;gap:6px;font-size:16px;color:#fff1cd}.quest-board-grid{display:block}.reading-v2-quest-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.quest-board-pager{background:transparent}#screen-quest-board .quest-board-wood .quest-card .btn{min-height:32px}@media(max-width:640px){.reading-v2-quest-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quest-board-header{flex-wrap:wrap}.preview-note{font-size:10px}.quest-board-wood{width:98vw}}</style>
</head><body><section id="screen-quest-board"><div class="quest-board-wood"><header class="quest-board-header"><h1 class="quest-board-heading">村人からの依頼</h1><label>学年<select id="grade"></select></label><span class="medal-sample" id="medal"></span></header><p class="preview-note">確認用・実際のセーブには保存しません</p><div class="quest-board-grid" id="board"></div></div></section>
<script type="module">
import {renderJapaneseReadingV2Subquests} from './japanese_reading_subquests_v2.js';
import {QUEST_MEDAL_IMAGE} from './quest_medal_art.js';
const game={player:{gold:0},questMedals:0},pages={};const grade=document.querySelector('#grade');for(let i=1;i<=6;i++)grade.add(new Option(`${i}年`,i));grade.value='4';
const rewardIcon=()=>`<img class="quest-villager-medal" src="${QUEST_MEDAL_IMAGE}" width="24" height="24" alt="クエストメダル">`;
function refresh(){document.querySelector('#medal').innerHTML=rewardIcon()+` ${game.questMedals}枚`;}
function render(){renderJapaneseReadingV2Subquests(document.querySelector('#board'),Number(grade.value),{game:()=>game,asset:p=>'/'+p,rewardIcon,bindRewards:()=>{},exp:()=>{},save:()=>{},refresh,pageForGrade:g=>pages[g]||0,setPageForGrade:(g,n)=>{pages[g]=n;}});refresh();window.boardArtReady=true;}grade.onchange=render;render();
</script></body></html>
