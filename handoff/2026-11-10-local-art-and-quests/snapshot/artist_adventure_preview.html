<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木もれ日の冒険者とステージ</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#f4eedf;color:#47372c;font-family:system-ui,-apple-system,sans-serif}main{max-width:1180px;margin:auto;padding:26px 22px 46px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:24px;margin:0 0 8px}p{font-size:13px;line-height:1.7;color:#786454;margin:4px 0 18px}a{color:#745535}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;font-size:13px;padding:9px 14px;border-radius:25px;border:1px solid #b8a68c;background:#fff9eb;color:#594331;cursor:pointer}button[aria-pressed=true]{background:#526d4f;color:#fff;border-color:#526d4f}.scene{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;border:1px solid #ae9c7e;background:#d5df9a}.landscape{width:100%;height:100%;object-fit:cover;display:block}.hero{position:absolute;height:48%;width:33%;object-fit:contain;bottom:12%;filter:none}.boy{left:21%}.girl{right:21%}figure{margin:0}figcaption{font-size:13px;padding:10px 0}h2{font-size:18px;margin:28px 0 10px}.portraits{display:grid;grid-template-columns:1fr 1fr;gap:22px}.portrait{border:1px solid #d3c4ad;border-radius:14px;overflow:hidden;background:#fffaf1}.portrait img{display:block;width:100%;height:350px;object-fit:contain;padding:16px;background:repeating-conic-gradient(#eee6d7 0% 25%,#faf3e7 0% 50%) 0/24px 24px}.portrait figcaption{padding:14px}small{color:#887259;font-size:12px}#state{margin-top:10px}@media(max-width:600px){main{padding:18px 12px}h1{font-size:21px}.portraits{gap:10px}.portrait img{height:240px;padding:8px}.hero{height:54%;width:37%}.boy{left:16%}.girl{right:16%}}
</style></head><body><main><header><div><h1>木もれ日の冒険者とステージ</h1><p>原画の絵柄を参考にした、新しい男女の冒険者・草原ステージ・拠点の試作。</p></div><a href="/skin_art_review.html?category=sample">スキン一覧で選んで指示する →</a></header><nav aria-label="場所の切り替え"><button data-place="stage" aria-pressed="true">草原ステージ</button><button data-place="home" aria-pressed="false">拠点・俯瞰案</button><button data-place="original" aria-pressed="false">元の拠点と比較</button></nav><nav aria-label="背景とキャラクターの表示"><button data-mode="background" aria-pressed="false">背景だけ</button><button data-mode="boy" aria-pressed="false">男の子</button><button data-mode="girl" aria-pressed="false">女の子</button><button data-mode="both" aria-pressed="true">2人を置く</button></nav><figure><div class="scene"><img class="landscape" src="/assets/artist-stage-samples/komorebi-clearing-v1.png" alt="手描きの木と草花、奥へ続く道がある草原のステージ"><img class="hero boy" src="/assets/artist-skin-samples/komorebi-adventurer-boy-v1.png" alt="緑の服と黄色いスカーフの男の子の冒険者"><img class="hero girl" src="/assets/artist-skin-samples/komorebi-adventurer-girl-v1.png" alt="オレンジの上着と三つ編みの女の子の冒険者"></div><figcaption id="state">背景＋男女の冒険者</figcaption></figure><small>背景とキャラクターはそれぞれ独立した画像です。重ねたときの見え方を確認できます。</small><h2>キャラクター単体</h2><div class="portraits"><figure class="portrait"><img src="/assets/artist-skin-samples/komorebi-adventurer-boy-v1.png" alt="男の子の全身イラスト"><figcaption>TRY-008　木もれ日の冒険者・男の子</figcaption></figure><figure class="portrait"><img src="/assets/artist-skin-samples/komorebi-adventurer-girl-v1.png" alt="女の子の全身イラスト"><figcaption>TRY-009　木もれ日の冒険者・女の子</figcaption></figure></div></main><script type="module">
let mode=new URLSearchParams(location.search).get('mode')==='background'?'background':'both',place=new URLSearchParams(location.search).get('place')==='home'?'home':'stage';
const labels={background:'背景だけ',boy:'男の子',girl:'女の子',both:'男女の冒険者'};
const places={stage:{name:'草原ステージ',file:'komorebi-clearing-v1.png',alt:'手描きの木と草花、奥へ続く道がある草原のステージ'},home:{name:'拠点・俯瞰案',file:'komorebi-village-aerial-v2.png',alt:'元の施設配置を保って手描きで描き直した俯瞰の拠点'},original:{name:'元の拠点',file:'home_town_v2.png',src:'/画像/home_town_v2.png',alt:'比較用の元の俯瞰拠点マップ'}};
function update(){
 document.querySelector('.boy').hidden=!['boy','both'].includes(mode);
 document.querySelector('.girl').hidden=!['girl','both'].includes(mode);
 const bg=document.querySelector('.landscape');bg.src=places[place].src||'/assets/artist-stage-samples/'+places[place].file;bg.alt=places[place].alt;
 document.querySelector('#state').textContent=places[place].name+' / '+labels[mode];
 document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 document.querySelectorAll('button[data-place]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.place===place)));
}
for(const b of document.querySelectorAll('button[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;update();};
for(const b of document.querySelectorAll('button[data-place]'))b.onclick=()=>{place=b.dataset.place;update();};
window.render_game_to_text=()=>JSON.stringify({screen:'adventure-art-preview',mode,place,characters:mode==='both'?['TRY-008','TRY-009']:mode==='background'?[]:[mode==='boy'?'TRY-008':'TRY-009'],background:places[place].file});
update();
</script></body></html>
