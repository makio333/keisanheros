<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お知らせ機能・ローカル確認</title><style>body{margin:0;background:#142535;color:#fff1d0;font:18px sans-serif}.preview-main{max-width:850px;margin:40px auto;padding:24px}.preview-main button{padding:16px;margin:8px;border-radius:12px;font:inherit;cursor:pointer}.preview-main p{line-height:1.7}</style><main class="preview-main"><h1>お知らせ機能の確認</h1><p>ローカル専用です。実際のプレイヤーへの公開・プレゼント配布は行いません。</p><button id="player">プレイヤー側のお知らせを見る</button><button id="admin">管理者側：お知らせを作る</button><button id="reset">確認データをリセット</button><p id="balance"></p></main><script type="module">
import {showAnnouncements,showAnnouncementAdmin} from './announcements.js';
import {applyGiftPayload} from './economy.js';
import {EQUIPMENT_TEN_PULL_TICKET_ICON} from './equipment_ticket_art.js';
const key='legend-announcement-ui-preview';
const initial=()=>({game:{player:{gold:0}},notices:[{id:'demo-kanji',title:'漢字の冒険にも挑戦してみよう！',body:'漢字の読みを答えて、冒険を進めよう。\nお知らせを見てくれたみんなに、スキンガチャチケットを1枚プレゼント！',image:'assets/christmas/present_rescue_banner_v2.png',gold:0,items:[{kind:'ticket',id:'skin-ticket',count:1}],active:true}]});
let state;try{state=JSON.parse(localStorage.getItem(key))||initial();}catch{state=initial();}
const save=()=>{localStorage.setItem(key,JSON.stringify(state));document.querySelector('#balance').textContent=`確認用プレイヤー：${state.game.player.gold} G ／ スキンチケット ${state.game.skinGachaTickets||0}枚 ／ 装備10連チケット ${state.game.equipGachaTenPullTickets||0}枚`;};
const catalog=[{name:'スキンガチャチケット',kind:'ticket',id:'skin-ticket',image:'assets/items/background_skin_ticket.png'},{name:'装備ガチャ10連チケット',kind:'ticket',id:'equip-ten-ticket',image:EQUIPMENT_TEN_PULL_TICKET_ICON},{name:'氷星の女王',kind:'skin',id:'christmas_star_cartographer',image:'assets/christmas/skin_ice_star_queen_v2.png'},{name:'聖夜の黒騎士',kind:'skin',id:'christmas_snowboard_courier',image:'assets/christmas/skin_holy_night_knight_v2.png'}];
const api={game:()=>state.game,asset:path=>'/'+path,remote:()=>({permissions:async()=>({admin:true}),list:async admin=>state.notices.filter(n=>admin||n.active),publish:async value=>{state.notices.unshift({id:crypto.randomUUID(),...value,active:true,createdAt:Date.now()});save();},archive:async id=>{state.notices.find(n=>n.id===id).active=false;save();}}),artCatalog:()=>[{name:'クリスマスイベントの挿絵',image:'assets/christmas/present_rescue_banner_v2.png'},...catalog.filter(n=>n.kind==='skin')],rewardOptions:()=>catalog.map(n=>`<option value="${n.kind}:${n.id}">${n.name}</option>`).join(''),rewardName:item=>catalog.find(n=>n.id===item.id)?.name||item.id,rewardIcon:(item,size=48)=>`<img src="/${catalog.find(n=>n.id===item.id)?.image||'assets/christmas/present_box_token_v1.png'}" alt="" style="width:${size}px;height:${size}px;object-fit:contain">`,markRead:id=>{state.game.readAnnouncementIds=[...new Set([...(state.game.readAnnouncementIds||[]),id])];save();},claim:async notice=>{applyGiftPayload(state.game,{...notice,id:'announcement:'+notice.id});save();}};
document.querySelector('#player').onclick=()=>showAnnouncements(api);document.querySelector('#admin').onclick=()=>showAnnouncementAdmin(api);document.querySelector('#reset').onclick=()=>{state=initial();save();};save();
</script></html>
