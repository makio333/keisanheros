<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラクターと武器と敵・アート確認</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/skin_art_review.css"></head>
<body><header><div class="heading"><span class="eyebrow">LEGEND HEROES / ART GALLERY</span><h1>キャラ・武器・敵のアート</h1><p>気になるアートにチェック。個別メモと、まとめての指示を付けられます。</p></div><div class="tools"><input id="search" type="search" placeholder="名前・番号で探す" aria-label="名前・番号で探す"><select id="category" aria-label="種類"><option value="all">すべて</option><option value="sample">試作・あなたの絵柄</option><option value="weapon-sample">武器・あなたの絵柄</option><option value="monster-sample">敵・あなたの絵柄</option><option value="initial">初期キャラクター</option><option value="gacha">通常ガチャ</option><option value="halloween">ハロウィン</option><option value="christmas">クリスマス</option><option value="raid">レイド</option><option value="quest-medal">メダル限定</option></select><label class="only"><input id="only" type="checkbox">選択したものだけ</label><span id="counts" role="status"></span></div></header>
<main><section id="gallery" aria-label="キャラクターと武器と敵のアート"></section><p id="empty" hidden>該当するキャラクターがありません。</p><aside><div class="review-head"><h2>まとめて指示</h2><strong id="selected-count">0枚選択</strong></div><p class="help">チェックとメモはこのブラウザに保存されます。選択は自動送信されません。「指示をコピー」でチャットに貼り付けてください。</p><div class="bulk"><button id="select-visible">表示中を選択</button><button id="clear">選択を外す</button></div><div id="selected-list"></div><label for="batch">選んだアートへの共通の指示</label><textarea id="batch" rows="5" placeholder="例：このキャラクターたちの背景を透過して、全身が収まるようにしてほしい"></textarea><button id="copy" class="primary" disabled>指示をコピー</button><button id="download" disabled>選択と指示を保存</button><p id="feedback" role="status" aria-live="polite"></p><details><summary>チャットに渡す内容を確認</summary><textarea id="output" rows="10" readonly aria-label="コピーする指示"></textarea></details></aside></main>
<dialog id="zoom"><button id="close-zoom" aria-label="拡大表示を閉じる">閉じる ×</button><h2 id="zoom-title"></h2><img id="zoom-image" alt=""><label class="zoom-check"><input id="zoom-select" type="checkbox">このアートを選択</label></dialog><script type="module" src="/skin_art_review.js"></script></body></html>
