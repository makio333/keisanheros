<!doctype html><html lang="ja"><meta charset="utf-8"><title>古代挑戦状 印刷adapter V2 独立見本</title><link rel="stylesheet" href="word_problem_print_layout_v2.css"><style>body{margin:0;background:#ddd}.controls{position:sticky;top:0;padding:12px;background:white;z-index:2;font:15px sans-serif}button,select{font:inherit;margin:4px}.wpp2-root .wpp2-page{margin:8mm auto}@media print{.controls{display:none}}</style><div class="controls">架空データ・消費は模擬のみ<br><label>出題 <select id="data"><option value="practical" selected>通常3年生（確定教材3題）</option><option value="short">短文fixture</option><option value="long">異常長文stress（1805字×3）</option></select></label><label>方式 <select id="strategy"><option value="two-page">従来2面（実寸検査）</option><option value="readability">読みやすさ優先（自動ページ）</option></select></label><button id="prepare">枚数を確認</button><p id="status"></p><label><input type="checkbox" id="confirm">表示した用紙枚数を確認しました</label><button id="open" disabled>印刷画面を開く（模擬1個消費）</button><button id="again">同じ画面で再印刷</button><button id="teacher">指導者解答の枚数を確認</button><span id="count">模擬消費：0</span></div><main id="preview"></main><script type="module">
import {ancientPrintPlanV2,prepareAncientPrintPreviewV2,createAncientPrintSessionV2,paginateAncientAutomaticV2} from './ancient_word_problem_print_adapter_v2.js';
import {paginateWordProblemPrintV2} from './word_problem_print_layout_v2.js';
import {ancientFixture,ancientPracticalFixture} from './tests/word_problem_print_layout_v2/ancient-fixture.js';
import {MATH_WORD_QUESTS_V2} from './math_word_quests_v2.js';
let plan,prepared,teacherPreview=null,consume=0;const $=id=>document.getElementById(id);
const session=createAncientPrintSessionV2({openWindow(p){const w=window.open('','_blank','width=900,height=900');if(!w)return null;w.document.write(`<!doctype html><html lang="ja"><meta charset="utf-8"><title>架空挑戦状</title>${p.css==='legacy-inline'?'':'<link rel="stylesheet" href="'+new URL('./word_problem_print_layout_v2.css',location.href).href+'">'}<p style="font:14px sans-serif" class="wpp2-controls">ブラウザーの印刷を本人が操作してください。キャンセル後も同じ画面で再印刷できます。<button onclick="window.print()">印刷</button></p>${p.html}</html>`);w.document.close();return w;},onFirstOpen(){for(const id of ['data','strategy','prepare'])$(id).disabled=true;consume++;$('count').textContent=`模擬消費：${consume}`;}});
$('prepare').onclick=async()=>{window.adapterReady=null;teacherPreview=null;$('teacher').textContent='指導者解答の枚数を確認';$('open').disabled=true;$('confirm').checked=false;const g3=MATH_WORD_QUESTS_V2.filter(p=>p.grade===3);plan=ancientPrintPlanV2($('data').value==='practical'?ancientPracticalFixture([g3[0],g3[2],g3.find(p=>p.id==='mwq-v2-g3-023')]):ancientFixture($('data').value==='long'));prepared=await prepareAncientPrintPreviewV2($('preview'),plan,$('strategy').value);$('status').textContent=prepared.ready?`児童用${prepared.pages}ページ / 両面なら${prepared.paperSheets}枚。全33問、27問以上正解。解答は別紙。`:'従来2面には収まりません。読みやすさ優先を選んで確認してください。';window.adapterReady=prepared;};
$('confirm').onchange=()=>{$('open').disabled=!($('confirm').checked&&prepared?.ready);};
for(const id of ['data','strategy'])$(id).onchange=()=>{prepared=null;$('open').disabled=true;$('confirm').checked=false;$('status').textContent='条件が変わりました。枚数を再確認してください。';};
$('open').onclick=()=>{if($('confirm').checked&&prepared?.ready)session.open(prepared);};$('again').onclick=()=>session.printAgain();
$('teacher').onclick=async()=>{if(!plan)return;
 if(!teacherPreview){const box=document.createElement('div');box.style.cssText='position:absolute;left:-12000px;visibility:hidden';box.innerHTML=plan.teacherHtml;document.body.append(box);await paginateAncientAutomaticV2(box);const pages=[...box.querySelectorAll('.wpp2-page')];pages.forEach((p,i)=>p.querySelector('footer').textContent=`指導者用解答 ${i+1} / ${pages.length}`);teacherPreview={html:box.innerHTML,pages:pages.length};box.remove();$('teacher').textContent=`指導者解答を開く（${teacherPreview.pages}ページ）`;$('status').textContent+=` 指導者解答は別紙${teacherPreview.pages}ページ。もう一度解答ボタンを押すと開きます。`;return;}
 const w=window.open('','_blank');if(!w)return;w.document.write(`<!doctype html><html lang="ja"><meta charset="utf-8"><title>指導者解答</title><link rel="stylesheet" href="${new URL('./word_problem_print_layout_v2.css',location.href).href}"><p class="wpp2-controls">指導者用解答・児童問題と別印刷<button onclick="window.print()">印刷</button></p>${teacherPreview.html}</html>`);w.document.close();};
$('prepare').click();
</script></html>
