<!doctype html><html lang="ja"><meta charset="utf-8"><title>確定算数教材 印刷見本V2</title><link rel="stylesheet" href="word_problem_print_layout_v2.css"><style>body{margin:0;background:#ddd}.wpp2-controls{padding:15px;background:white;font:15px sans-serif}select,button{font:inherit;margin:5px}</style><div class="wpp2-controls">確定算数180題・非公開の印刷確認<select id="problem"></select><select id="mode"><option value="student">児童問題</option><option value="teacher">指導者解答（別印刷）</option></select><button id="prepare">プレビュー作成</button><button id="print" disabled>本人操作で印刷</button><span id="status"></span></div><main id="preview"></main><script type="module">
import {MATH_WORD_QUESTS_V2} from './math_word_quests_v2.js';import {renderMathWordPrintV2} from './math_word_problem_print_adapter_v2.js';import {paginateWordProblemPrintV2} from './word_problem_print_layout_v2.js';
const $=id=>document.getElementById(id);for(const p of MATH_WORD_QUESTS_V2){const o=document.createElement('option');o.value=p.id;o.textContent=`${p.grade}年 ${p.id} ${p.title} (${p.answerKind})`;$('problem').append(o);}const params=new URLSearchParams(location.search);if(params.has('id'))$('problem').value=params.get('id');if(params.get('mode')==='teacher')$('mode').value='teacher';
$('prepare').onclick=async()=>{$('print').disabled=true;try{$('preview').innerHTML=renderMathWordPrintV2($('problem').value,{mode:$('mode').value});const r=await paginateWordProblemPrintV2(document.querySelector('.wpp2-root'));$('status').textContent=`${r.pages}ページ・${r.mode==='student'?'児童用問題':'指導者解答'}。別々に印刷してください。`;$('print').disabled=false;}catch(e){$('status').textContent=e.message;}};for(const id of ['problem','mode'])$(id).onchange=()=>{$('print').disabled=true;$('status').textContent='プレビューを更新してください。';};$('print').onclick=()=>window.print();$('prepare').click();
</script></html>
