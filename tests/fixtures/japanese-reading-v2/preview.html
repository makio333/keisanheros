<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国語の冒険図書室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2efe5;color:#253b3a;font-family:system-ui,sans-serif;line-height:1.8}header{background:#234b49;color:#fff;padding:26px max(20px,calc((100vw - 1120px)/2))}header p{margin:0;font-size:14px}h1{font-size:28px;margin:0 0 8px}nav{max-width:1160px;margin:20px auto;padding:0 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}select,button,input,textarea{font:inherit;color:inherit}select,input,textarea{max-width:100%;padding:10px;border:1px solid #a6b7ae;border-radius:8px;background:white}button{border:1px solid #9aaea5;border-radius:8px;background:#fff;padding:8px 15px;cursor:pointer}button.primary{background:#24675c;color:white;border-color:#24675c}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c96e25;outline-offset:3px}main{max-width:1160px;margin:auto;padding:0 20px 40px}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}.card{background:#fffef9;border-radius:14px;padding:26px;border:1px solid #d9dfd4;min-width:0}.story{position:sticky;top:14px}.story h2{margin:0 0 4px;font-size:25px}.meta{font-size:13px;color:#61716a}.passage{font-size:18px;line-height:2.5;overflow-wrap:anywhere}.passage p{margin:18px 0}.paragraph-label{font-size:11px;background:#e6eee5;padding:2px 5px;border-radius:5px;margin-right:6px;vertical-align:middle}rt{font-size:.52em}ruby{ruby-align:center}u{text-decoration-thickness:2px;text-underline-offset:4px}.reference-label{font-size:11px;color:#8b470d}.evidence{background:#fff0b8}.question{padding:22px 0;border-bottom:1px solid #dfe4da}.question:first-child{padding-top:0}.question:last-child{border-bottom:0}.question h3{font-size:16px;margin:0 0 12px}.option{display:flex;gap:9px;align-items:start;padding:9px;margin:8px 0;background:#f0f4ed;border-radius:7px}.option input{margin-top:8px}.feedback{margin-top:12px;white-space:pre-wrap}.correct{color:#1a6851}.incorrect{color:#9e3e24}textarea{display:block;width:100%;min-height:105px;margin:10px 0}.reading-kana-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:10px}.reading-kana-grid button{padding:5px 0;font-size:16px}.reading-kana-controls{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.reading-kana-controls button{font-size:13px;padding:6px}.answer-tools{margin-top:10px}summary{cursor:pointer}#printArea{display:none}.print-cells{display:flex;flex-wrap:wrap}.cell{display:inline-block;width:1.6em;height:1.6em;border:1px solid #555;margin:0 -1px -1px 0}.print-lines{height:2.2em;border-bottom:1px solid #888}.support{font-size:13px;color:#61716a;margin:10px 0}.status{font-size:14px}footer{max-width:1120px;margin:0 auto;padding:16px 20px;color:#61716a;font-size:13px}@media(max-width:760px){.layout{grid-template-columns:1fr}.story{position:static}.card{padding:18px}header{padding:20px}h1{font-size:24px}.passage{font-size:17px}nav{gap:10px}.reading-kana-grid button{font-size:15px}}
@media print{body{background:white;color:black;font-size:11pt}header,nav,#screen,footer{display:none}#printArea{display:block}main{max-width:none;padding:0}.print-quest{break-before:page}.print-quest:first-child{break-before:auto}.print-quest h2{margin:0}.print-quest .passage{font-size:12pt;line-height:2.1}.print-question{break-inside:avoid;margin:16px 0}.print-quest .meta{font-size:9pt}ruby rt{font-size:.5em}@page{size:A4;margin:17mm}}
</style>
<header><p>村・港・探検の物語で読む力を育てる</p><h1>国語の冒険図書室</h1><p>1〜6年 ／ 60本文 ／ 文字で答える問題もあります</p></header>
<nav><label>学年 <select id="grade"></select></label><label>読む文章 <select id="quest"></select></label><label><input id="ruby" type="checkbox" checked> 読みがな</label><button id="print">この文章を印刷</button><button id="printGrade">この学年を印刷</button></nav>
<main><div id="screen" class="layout"><article class="card story"><h2 id="title"></h2><div class="meta" id="meta"></div><p class="support">読みがなは一部の言葉に付いています。読みにくい言葉は、聞いたり辞書で調べたりしてかまいません。</p><div id="passage" class="passage"></div></article><section class="card"><div class="status" id="status"></div><div id="questions"></div></section></div><div id="printArea"></div></main>
<footer>答えはこの画面の中だけで確認します。自由な考えは、先生や家の人と確かめましょう。</footer>
<script type="module">
import {JAPANESE_READING_QUESTS_V2 as bank,getJapaneseReadingQuestsV2,evaluateJapaneseReadingAnswerV2 as evaluate} from '/japanese_reading_quests_v2.js';
import {mountReadingAnswerBoard} from '/reading_answer_board.js';
const $=id=>document.getElementById(id),node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;};
let active=bank[0],answers=new Map(),shown=[];
function passageView(quest,container,highlight=[]){container.replaceChildren();const chars=[...quest.passage];
 for(const segment of quest.segments){const p=node('p');p.append(node('span',segment.label,'paragraph-label'));let i=segment.start;
  while(i<segment.end){const r=$('ruby').checked?quest.ruby.overrides.find(r=>r.start===i):null;const end=r?r.end:i+1;
   let token;if(r){token=node('ruby');token.append(node('span',r.base),node('rt',r.reading));}else token=node('span',chars[i]);
   const ref=quest.references.find(ref=>ref.start<=i&&i<ref.end);if(ref){const underline=node('u');underline.append(token);token=underline;if(i===ref.start)token.prepend(node('sup',ref.label,'reference-label'));}
   if(highlight.some(e=>e.start<end&&e.end>i))token.classList.add('evidence');p.append(token);i=end;
  }container.append(p);
 }
}
function updateStatus(){const auto=active.questions.filter(q=>q.scoring.mode!=='human-rubric');const complete=auto.filter(q=>answers.get(q.id)?.correct).length;$('status').textContent=`じぶんで たしかめる：${complete} / ${auto.length}　考えを話す・書く：1問`;
 window.render_game_to_text=()=>JSON.stringify({grade:active.grade,questId:active.id,title:active.title,questionTypes:active.questions.map(q=>q.input.type),correct:complete,total:auto.length,reviewMode:'human-rubric',coordinateSystem:'DOM reading order, top to bottom'});
}
function render(){answers=new Map();shown=[];$('title').textContent=active.title;$('meta').textContent=`${active.grade}年・${active.genre}・本文${active.characterCount}字`;
 passageView(active,$('passage'));$('questions').replaceChildren();
 for(const [index,q] of active.questions.entries()){const form=node('form',null,'question');form.dataset.questionId=q.id;form.append(node('h3',`${index+1}　${q.prompt}`));let input;
  if(q.input.type==='single-choice')for(const [i,o]of q.input.options.entries()){const label=node('label',null,'option'),radio=node('input');radio.type='radio';radio.name=q.id;radio.value=o.id;label.append(radio,node('span',`${['ア','イ','ウ'][i]}　${o.text}`));form.append(label);}
  else if(q.input.type==='extraction'){input=node('input');input.type='text';input.autocomplete='off';input.setAttribute('aria-label','抜き出しの答え');form.append(input,node('p',`本文の表記で${q.print.cells}字。ひらがな・カタカナでも答えられます。`,'support'));const details=node('details',null,'answer-tools'),board=node('div');details.append(node('summary','50音のキーをひらく'),board);mountReadingAnswerBoard(input,board);form.append(details);}
  else{input=node('textarea');input.setAttribute('aria-label','自分の考え');form.append(input,node('p','一つの正解はありません。本文の言葉と、自分の考えとのつながりを説明しましょう。','support'));}
  const submit=node('button',q.input.type==='open-response'?'考えをたしかめる':'答えをたしかめる','primary');submit.type='submit';const feedback=node('div',null,'feedback');feedback.setAttribute('aria-live','polite');form.append(submit,feedback);
  form.onsubmit=e=>{e.preventDefault();const value=q.input.type==='single-choice'?form.querySelector('input:checked')?.value:input.value;const result=evaluate(q,value);answers.set(q.id,result);feedback.className='feedback '+(result.correct?'correct':result.status==='needs-review'?'':'incorrect');
   if(result.status==='needs-review')feedback.textContent='先生や家の人と、次の点を確かめましょう。\n'+result.criteria.map(c=>'・'+c.description).join('\n')+'\n考えは自動で正誤を決めません。';
   else if(result.status==='invalid-input')feedback.textContent='答えを選ぶか、文字を入れてください。';
   else{feedback.textContent=(result.correct?'合っています。':'本文の手がかりを、もう一度見てみましょう。')+'\n'+q.explanation;shown=q.evidence;passageView(active,$('passage'),shown);}updateStatus();};
  $('questions').append(form);
 }updateStatus();}
function selectGrade(){const group=getJapaneseReadingQuestsV2($('grade').value);$('quest').replaceChildren(...group.map(q=>{const o=node('option',q.title);o.value=q.id;return o;}));active=group[0];render();}
for(let g=1;g<=6;g++){const o=node('option',`${g}年`);o.value=g;$('grade').append(o);} $('grade').onchange=selectGrade;$('quest').onchange=()=>{active=bank.find(q=>q.id===$('quest').value);render();};$('ruby').onchange=()=>passageView(active,$('passage'),shown);
function printQuests(quests){$('printArea').replaceChildren();for(const quest of quests){const page=node('article',null,'print-quest');page.append(node('h2',`${quest.grade}年　${quest.title}`),node('p','なまえ：　　　　　　　　　　　　　日付：　　　　　　　','meta'));const passage=node('div',null,'passage');passageView(quest,passage);page.append(passage);
 for(const [i,q]of quest.questions.entries()){const block=node('div',null,'print-question');block.append(node('p',`${i+1}　${q.prompt}`));if(q.input.type==='single-choice')q.input.options.forEach((o,k)=>block.append(node('div',`${['ア','イ','ウ'][k]}　${o.text}`)));else if(q.input.type==='extraction'){block.append(node('div',`本文どおりに書く枠（${q.print.cells}字）`,'meta'));for(const [label,count]of [['',q.print.cells],['かなで書く場合はこちら',q.print.kanaAlternativeCells]]){if(label)block.append(node('div',label,'meta'));const cells=node('div',null,'print-cells');for(let j=0;j<count;j++)cells.append(node('span',null,'cell'));block.append(cells);}}else for(let j=0;j<q.print.lines;j++)block.append(node('div',null,'print-lines'));page.append(block);} $('printArea').append(page);}window.print();}
$('print').onclick=()=>printQuests([active]);$('printGrade').onclick=()=>printQuests(getJapaneseReadingQuestsV2(active.grade));window.advanceTime=()=>{};selectGrade();
</script></html>
