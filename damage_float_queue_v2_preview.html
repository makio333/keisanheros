<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>連撃ダメージ・独立見本</title><link rel="stylesheet" href="damage_float_queue_v2.css"><style>body{margin:0;background:#13283d;color:white;font:18px system-ui}main{max-width:680px;margin:auto;padding:20px}h1{font-size:22px}button{padding:12px;margin:4px;border:0;border-radius:8px;background:#e4eef7;color:#142233;font-weight:bold}.arena{height:490px;background:linear-gradient(#294b65,#23352c);border-radius:20px;position:relative}.actor{position:absolute;left:50%;transform:translateX(-50%);text-align:center;width:200px;padding:20px 0;background:#43596c;border:2px solid #b9cad3;border-radius:16px}#enemy{top:230px}#player{bottom:25px}</style><main><h1>連撃ダメージ・表示だけの見本</h1><button id="start-btn">5連撃</button><button id="three">3連撃</button><button id="long">長い連撃＋回復</button><button id="skip">終了 / スキップ</button><div class="arena"><div class="actor" id="enemy">敵（fixture）</div><div class="actor" id="player">味方（fixture）</div></div></main><script type="module">
import {createDamageFloatQueueV2} from './damage_float_queue_v2.js';
const enemy=document.querySelector('#enemy'),player=document.querySelector('#player');
const q=createDamageFloatQueueV2({manual:true});let clock=0,jobs=[];
function start(n=5){q.clear();jobs=Array.from({length:n},(_,i)=>({at:clock+i*120,value: i===n-1?'99999999999999999999':String(120+i*31),type:i===n-1?'enemy-dmg crit':'enemy-dmg',target:enemy})); advanceTime(0);}
function advanceTime(ms){const end=clock+ms;do{const step=Math.min(16,end-clock);clock+=step;q.advance(step);for(const job of jobs.filter(j=>j.at<=clock)){q.enqueue(job.target,job.value,job.type);}jobs=jobs.filter(j=>j.at>clock);}while(clock<end);}
window.advanceTime=advanceTime;window.render_game_to_text=()=>JSON.stringify({coordinates:'viewport origin top-left; y down',...q.snapshot()});window.damagePreview={q,start,enemy,player};
document.querySelector('#start-btn').onclick=()=>start();document.querySelector('#three').onclick=()=>start(3);document.querySelector('#long').onclick=()=>{start(40);jobs.push({at:clock+240,value:'-85',type:'heal',target:player});};document.querySelector('#skip').onclick=()=>{jobs=[];q.clear();};
let last=performance.now();function loop(now){advanceTime(now-last);last=now;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
