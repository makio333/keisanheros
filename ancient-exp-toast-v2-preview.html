<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:, "><title>古代装備EXP 通知見本（fixture）</title><link rel="stylesheet" href="./ancient_exp_toast_v2.css"><style>body{margin:0;background:#f3f0e9;color:#252038;font:16px system-ui}main{max-width:700px;margin:auto;padding:16px;display:grid;gap:14px}header{padding:10px;background:#e8e0cc;border-radius:12px}h1{font-size:18px}section.question{background:white;padding:24px;border-radius:16px}nav{display:flex;flex-wrap:wrap;gap:8px}button{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid #756283;background:white}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}small{line-height:1.6}</style><main><header>バトル見本 · HP 120 / 120<h1>古代装備の経験値通知</h1></header><div id="toast"></div><section class="question"><p>１２ ＋ ８ ＝ ？</p><div class="answers"><button>２０</button><button>１８</button><button>２２</button><button>１６</button></div></section><nav><button id="gain">EXP獲得</button><button id="multi">複数装備</button><button id="level">Lv UP</button><button id="max">MAX到達</button><button id="cancel">場面変更 / 取消</button></nav><small>架空データのみ。再描画や初期表示では通知しません。通知は問題・解答欄の上に場所を確保し、操作を遮りません。複数装備は順番に表示、連続獲得は装備ごとに合算します。</small></main><script type="module">
import {createAncientExpToast} from './ancient_exp_toast_v2.js';
const toast=createAncientExpToast({root:document.querySelector('#toast'),nameOf:id=>id==='sword'?'古代の大剣':'古代の盾'});
const change=(uid='a',id='sword',amount=8,level=1,exp=8,next=30)=>({uid,id,amount,before:{level:1,exp:0,next:30},after:{level,exp,next}});
document.querySelector('#gain').onclick=()=>toast.notify([change()]);
document.querySelector('#multi').onclick=()=>toast.notify([change(),change('b','shield')]);
document.querySelector('#level').onclick=()=>toast.notify([change('a','sword',35,2,5,76)]);
document.querySelector('#max').onclick=()=>toast.notify([{...change('a','sword',100,50,0,0),before:{level:49,exp:0,next:100}}]);
document.querySelector('#cancel').onclick=()=>toast.sceneChanged();
window.toastQA=toast;window.render_game_to_text=()=>JSON.stringify(toast.snapshot());
</script></html>
