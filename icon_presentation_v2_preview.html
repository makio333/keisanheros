<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アイコン表示統一・独立確認</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="icon_presentation_v2.css">
<style>body{margin:0;padding:16px;background:#131522;color:#f8efdb;font:14px/1.5 sans-serif}body.light{background:#faf5eb;color:#211a32;--ipv2-panel-bg:#fff6e8;--ipv2-panel-fg:#211a32}main{max-width:1000px;margin:auto}button{font:inherit;padding:6px 10px}h1{font-size:22px}h2{font-size:18px}#pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.pair{padding:12px;border:1px solid #8c739d;border-radius:10px}.pair-head{min-height:44px}.pair-icons{display:flex;align-items:start;justify-content:space-around;gap:12px}.pair-icons>div{text-align:center}.pair-icons small{display:block}.rarities{display:flex;flex-wrap:wrap;gap:18px;margin:12px 0}.ipv2-panel{height:360px}#skills-end{margin:0}#result{overflow-wrap:anywhere}.muted{font-size:12px}</style>
<main><h1>アイコン表示統一</h1><p>ローカルfixture表示。交換所と持ち物で同じ表示関数を使用します。</p><button id="theme">明暗を切替</button> <button id="scroll-start">特技の先頭</button> <button id="scroll-end">特技の末尾</button>
<h2>特技・48px・Ⅱバッジ</h2><section class="ipv2-panel"><header class="ipv2-panel-header"><button type="button">もどる</button><b>とくぎ</b></header><div class="ipv2-panel-scroll" id="skills" tabindex="0" aria-label="特技一覧"></div></section>
<h2>レア度全6段階・選択／装備中</h2><div class="rarities" id="rarities"></div><h2>同一品比較・全カテゴリ</h2><p class="muted">左＝交換所／店／報酬。右＝所持一覧。同じID・レア度が同じ背景。個数、装備状態、選択は文字で表示。</p><div id="pairs"></div><p id="result" role="status"></p></main>
<script type="module">
import {renderIconCellV2,ICON_RARITIES_V2} from './icon_presentation_v2.js';
const f=await fetch('./artifacts/icon-presentation-v2/fixtures.json').then(r=>r.json());
const skills=document.querySelector('#skills');skills.innerHTML=f.SKILL_DB.map(s=>`<article class="ipv2-skill-row">${renderIconCellV2(s,{kind:'skill'})}<div class="ipv2-skill-copy"><div class="ipv2-skill-heading"><b>${s.name}</b><span>MP ${s.mp}</span></div><small>${s.desc}</small></div></article>`).join('')+'<p id="skills-end">特技一覧の末尾</p>';
let selectedRarity=6;const renderRarities=()=>document.querySelector('#rarities').innerHTML=ICON_RARITIES_V2.map(r=>`<div>${renderIconCellV2(f.equipment[0],{kind:'equip',rarity:r.rarity,equipped:r.rarity===4,selected:r.rarity===selectedRarity,interactive:true})}<small>★${r.rarity} ${r.name}</small></div>`).join('');renderRarities();
const entries=[...f.ITEM_DB.map(db=>({db,kind:'item',count:12})),...f.BLUEPRINT_DB.map(db=>({db,kind:'blueprint',count:3})),...[...f.GHOST_RAID_PRIZES,...f.HALLOWEEN_EXCHANGE_PRIZES].map(p=>({db:p.kind==='equip'?f.equipment.find(d=>d.id===(p.equipId||p.id)):f.cosmetics.find(d=>d.id===p.id),kind:p.kind,rarity:p.rarity,count:p.kind==='equip'?null:1})),...[
['equip-ticket','装備ガチャ10連チケット','🎫'],['skin-ticket','背景スキンガチャチケット','🎟️'],['raid-ticket','レイドチケット','assets/raid/raid_ticket_pixel.png'],['halloween-ticket','ハロウィンチケット','assets/halloween/ticket_icon.png'],['halloween-candy','ハロウィンのお菓子','assets/halloween/candy_token.png'],['currency','ゴールド','💰']].map(([kind,name,emoji])=>({db:{id:kind,name,emoji},kind,count:99}))];
if(entries.some(e=>!e.db))throw Error('fixture mapping missing');
document.querySelector('#pairs').innerHTML=entries.map(({db,...o},i)=>`<section class="pair" data-pair="${i}"><div class="pair-head"><b>${db.name}</b> ${o.rarity?'★'+o.rarity:''}<small> ${db.id}</small></div><div class="pair-icons"><div>${renderIconCellV2(db,{...o,count:null,size:48})}<small>交換所・店・報酬</small></div><div>${renderIconCellV2(db,{...o,size:48,equipped:o.kind==='equip'&&i%2===0,selected:i===0})}<small>持ち物</small></div></div></section>`).join('');
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');document.querySelector('#scroll-start').onclick=()=>skills.scrollTop=0;document.querySelector('#scroll-end').onclick=()=>skills.scrollTop=skills.scrollHeight;
document.querySelector('#rarities').addEventListener('click',e=>{const button=e.target.closest('button.ipv2-cell');if(!button)return;const rarity=Number(button.dataset.iconRarity);selectedRarity=selectedRarity===rarity?null:rarity;renderRarities();document.querySelector('#result').textContent=`${rarity}つ星 ${selectedRarity?'選択中':'選択解除'}`;});
window.render_game_to_text=()=>JSON.stringify({mode:'isolated-icon-preview',theme:document.body.classList.contains('light')?'light':'dark',skills:f.SKILL_DB.length,pairs:entries.length,scrollTop:skills.scrollTop,scrollMax:skills.scrollHeight-skills.clientHeight});window.advanceTime=()=>{};window.iconPreviewReady=true;
</script></html>
