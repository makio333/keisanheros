<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>メダル交換所限定・星読みの図書館</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111c2d;color:#f7efd9;font:16px/1.7 sans-serif}main{max-width:1100px;margin:auto;padding:28px 20px}header{border-bottom:1px solid #aa8a51;padding-bottom:22px}h1{font-size:clamp(25px,4vw,38px);margin:8px 0;color:#ffe0a2}.eyebrow{color:#dfba72;font-size:12px;letter-spacing:.18em}p{margin:8px 0}.note{color:#bbc9d9;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:24px}.card{border:1px solid #81704f;border-radius:14px;background:#1c2b41;padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center}.art{width:100%;aspect-ratio:1;display:grid;place-items:center;background:#152033;border-radius:9px}.art img{width:94%;height:94%;object-fit:contain}.card[data-kind=background] .art img{width:100%;height:100%;object-fit:cover;border-radius:9px}h2{font-size:19px;margin:12px 0 3px}.tag{color:#ffe0a2;font-size:12px}.cost{margin-top:auto;padding-top:10px}button{font:inherit;cursor:pointer;border:1px solid #bc985a;border-radius:8px;background:#e9c783;color:#202737;padding:8px 16px}button:disabled{background:#27374e;color:#c8d2df;cursor:default}.ability{font-size:13px;min-height:1.7em;color:#d6e8f5}#status{min-height:1.7em;color:#ffe0a2}.actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:14px}
</style><main><header><div class="eyebrow">QUEST MEDAL EXCLUSIVE</div><h1>星読みの図書館</h1><p>クエストメダル交換所だけで手に入る限定シリーズ。</p><p class="note">体験用メダル1600枚。メダルは減らず、各景品は一度ずつ受け取れます。実際のゲームのセーブには影響しません。</p><div class="actions"><strong>🏅 <span id="balance">1600</span>枚</strong><button id="reset">体験を最初から</button></div><p id="status" role="status"></p></header><section class="grid" id="catalog"></section></main>
<script type="module">
import {QUEST_MEDAL_EXCLUSIVE_PRIZES as prizes,claimQuestMedalExclusive as claim} from './quest_medal_exclusives.js';
let game;const labels={skin:'キャラクタースキン',background:'背景',decoration:'フレーム',equip:'限定装備'};const abilities={crit_up:'かいしん率アップ',guard:'ダメージ軽減',mp_save:'MP消費を軽減'};
function render(){document.getElementById('catalog').innerHTML=prizes.map(p=>`<article class="card" data-kind="${p.kind}"><div class="tag">交換所限定 · ${labels[p.kind]}</div><div class="art"><img src="/${p.image}" alt="${p.label}"></div><h2>${p.label}</h2><div class="tag">${p.rarity===5?'★★★★★ レジェンド':''}</div><div class="ability">${abilities[p.ability]||'見た目の変更で使えます'}</div><p class="cost">🏅 ${p.medals}枚で解放</p><button data-claim="${p.key}" ${game.questMedalExchanged[p.key]?'disabled':''}>${game.questMedalExchanged[p.key]?'うけとりずみ':'試しに受け取る'}</button></article>`).join('');document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const reward=claim(game,b.dataset.claim);document.getElementById('status').textContent=reward?`${reward.name}を獲得！ メダルは1600枚のままです。`:'';render();});}
function reset(){game={questMedals:1600,questMedalExchanged:{},nextUid:1,ownedEquips:[],unlockedSkins:[],unlockedAvatarBackgrounds:['default'],unlockedDecorations:[]};document.getElementById('status').textContent='';render();}document.getElementById('reset').onclick=reset;reset();
</script></html>
